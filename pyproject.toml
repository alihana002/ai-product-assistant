[project]
name = "ai-product-assistant"
version = "0.1.0"
description = "Product Assistant powered by AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
]

[project.scripts]
ai-product-assistant = "ai_product_assistant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
